name: Publish A股智投工作台 Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows-update:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.2.${{ github.run_number }}
      UPDATE_BASE_URL: https://github.com/tcitllc6-debugT/a-share-investment-workbench/releases/download/v1.2.${{ github.run_number }}
      UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build signed update payload
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_PRIVATE_KEY)) { throw 'UPDATE_MANIFEST_PRIVATE_KEY is required' }
          wails build -clean -s -ldflags "-X main.Version=$env:APP_VERSION -X main.VersionCommit=${{ github.sha }}"
          go build -trimpath -ldflags "-s -w" -o build\bin\a-share-updater.exe .\backend\cmd\a-share-updater
          $keyPath = Join-Path $env:RUNNER_TEMP 'manifest-private.key'
          [IO.File]::WriteAllText($keyPath, $env:UPDATE_MANIFEST_PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
          .\scripts\publish-a-share-update.ps1 -Version $env:APP_VERSION -BaseUrl $env:UPDATE_BASE_URL -Notes "GitHub 自动构建 $env:APP_VERSION" -ManifestKeyPath $keyPath
          .\scripts\build-portable.ps1 -Version $env:APP_VERSION

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: A股智投工作台 v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            build/release/${{ env.APP_VERSION }}/a-share-investment-workbench-windows-amd64.zip
            build/release/${{ env.APP_VERSION }}/a-share-investment-workbench-portable-windows-amd64.zip
            build/release/${{ env.APP_VERSION }}/manifest.json

  publish-macos-release:
    needs: publish-windows-update
    runs-on: macos-14
    env:
      APP_VERSION: 1.2.${{ github.run_number }}
      VERSION_COMMIT: ${{ github.sha }}
      UPDATE_BASE_URL: https://github.com/tcitllc6-debugT/a-share-investment-workbench/releases/download/v1.2.${{ github.run_number }}
      UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build universal macOS DMG
        shell: bash
        run: |
          chmod +x scripts/build-macos.sh
          scripts/build-macos.sh darwin/universal yes

      - name: Extend and sign update manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_MANIFEST_PRIVATE_KEY" ]; then echo 'UPDATE_MANIFEST_PRIVATE_KEY is required' >&2; exit 1; fi
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          gh release download "v$APP_VERSION" --pattern manifest.json --dir "$release_dir"
          dmg_path=$(find build/bin -maxdepth 1 -name 'a-share-investment-workbench_*_macos_universal.dmg' -print -quit)
          test -n "$dmg_path"
          python3 - "$release_dir/manifest.json" "$dmg_path" "$UPDATE_BASE_URL" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          asset_path = pathlib.Path(sys.argv[2])
          base_url = sys.argv[3].rstrip('/')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          with asset_path.open('rb') as asset_file:
              digest = hashlib.file_digest(asset_file, 'sha256').hexdigest()
          assets = [asset for asset in manifest.get('assets', []) if asset.get('os') != 'darwin']
          for arch in ('amd64', 'arm64'):
              assets.append({
                  'name': asset_path.name,
                  'os': 'darwin',
                  'arch': arch,
                  'url': f'{base_url}/{asset_path.name}',
                  'sha256': digest,
                  'size': asset_path.stat().st_size,
              })
          manifest['assets'] = assets
          manifest['signature'] = ''
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          key_path="$RUNNER_TEMP/manifest-private.key"
          printf '%s' "$UPDATE_MANIFEST_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          go run ./backend/cmd/update-manifest sign -key "$key_path" -manifest "$release_dir/manifest.json"
          cp "$dmg_path" "$release_dir/"

      - name: Publish macOS DMG and completed manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: |
            ${{ runner.temp }}/release/a-share-investment-workbench_*_macos_universal.dmg
            ${{ runner.temp }}/release/manifest.json
